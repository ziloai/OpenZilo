# Federated documentation manifest for ziloai/openzilo-docs.
# Each [[pages]] entry pairs an English and Simplified Chinese Markdown source
# in this repository with its target route under openzilo-docs/content/docs/.

[meta]
repo = "ziloai/OpenZilo"
assets_dir = "docs/assets"

# --- Products & Firmware (content/docs/product/) ---
# product/index(.zh-CN).mdx is maintained directly in openzilo-docs.

[[sections]]
dir = "overview/hardware"
title_en = "Hardware & Firmware"
title_zh = "硬件与固件说明"
pages = ["index", "first-use", "buttons", "leds", "recording", "firmware"]

[[pages]]
route = "overview/hardware/first-use"
en = "wiki/First-Use.md"
zh = "wiki/First-Use-zh-CN.md"

[[pages]]
