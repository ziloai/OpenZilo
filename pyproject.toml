[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenZilo"
dynamic = ["version"]
description = "OpenZilo Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenZilo" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["bleak>=0.21"]

[project.scripts]
openzilo = "openzilo._cli:run"

[project.urls]
Homepage = "https://github.com/ziloai/openzilo"
Repository = "https://github.com/ziloai/openzilo"

[project.optional-dependencies]
pcm = [
    "av>=14",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "openzilo._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
docs = [
    "markdown-it-py>=3",
    "pyyaml>=6",
    "tomli>=2 ; python_full_version < '3.11'",
    "zensical>=0.0.67",
]
