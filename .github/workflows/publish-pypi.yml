name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
      - name: Build release distributions
        run: |
          version=$(python -c 'from runpy import run_path; print(run_path("src/openzilo/_version.py")["__version__"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Upload to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -z "$UV_PUBLISH_TOKEN" ]]; then
            echo 'The PYPI_API_TOKEN repository secret is required.' >&2
            exit 1
          fi
          uv publish --trusted-publishing never --check-url https://pypi.org/simple
