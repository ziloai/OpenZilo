name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python -m compileall src
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run openzilo --help
      - run: uv sync --locked --extra pcm
      - run: |
          uv run --extra pcm python -m unittest discover -s tests -p test_live_pcm.py -v
          uv run --extra pcm python -m unittest discover -s tests -p test_recording_control.py -v
