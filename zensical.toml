# Content stays in the existing docs/, wiki/, and repository Markdown files.
# tools/build_docs.py supplies the routes, translated navigation, and SDK version.
[project]
site_name = "OpenZilo"
site_url = "https://ziloai.github.io/OpenZilo/"
repo_url = "https://github.com/ziloai/OpenZilo"
repo_name = "ziloai/OpenZilo"
edit_uri = ""
use_directory_urls = false
copyright = "Copyright © OpenZilo"
markdown_extensions = ["admonition", "pymdownx.details", "pymdownx.superfences", "tables", "attr_list", "md_in_html", "def_list"]

[project.theme]
variant = "modern"
features = ["navigation.sections", "navigation.indexes", "content.code.copy"]

[project.theme.icon.admonition]
tip = "material/new-box"
